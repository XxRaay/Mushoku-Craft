plugins {
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":Common").loom.accessWidenerPath
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    // NeoForge
    neoForge "net.neoforged:neoforge:${rootProject.neo_version}"

    common(project(path: ":Common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":Common", configuration: "transformProductionNeoForge")) { transitive = false }

    // Architectury API
    modApi "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

    // GeckoLib
    modImplementation "software.bernie.geckolib:geckolib-neoforge-${rootProject.minecraft_version}:${rootProject.geckolib_version}"

    // Test Mods
    modImplementation files(
        "libs/bettercombat-neoforge-2.4.0+1.21.1.jar",
        "libs/cloth-config-15.0.140-neoforge.jar",
        "libs/dummmmmmy-1.21-2.0.12-neoforge.jar",
        "libs/moonlight-neoforge-1.21.1-3.1.1.jar",
        "libs/player-animation-lib-forge-2.0.4+1.21.1.jar",
        "libs/tiny-config-3.1.0-neoforge.jar",
        "libs/codecui-neoforge-1.21.1-1.1.5.jar"
    )
}

processResources {
    def expandProps = [
        "version": project.version,
        "loader_version_range": rootProject.loader_version_range,
        "mod_license": rootProject.mod_license,
        "mod_id": rootProject.mod_id,
        "mod_version": rootProject.mod_version,
        "mod_name": rootProject.mod_name,
        "mod_authors": rootProject.mod_authors,
        "mod_description": rootProject.mod_description,
        "neo_version_range": rootProject.neo_version_range,
        "minecraft_version_range": rootProject.minecraft_version_range
    ]
    inputs.properties expandProps

    filesMatching("META-INF/neoforge.mods.toml") {
        expand expandProps
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set(null)
}

jar {
    archiveClassifier.set("dev")
}


task dumpConfigs { doLast { configurations.each { println it.name } } }


task dumpConfigs2 { doLast { configurations.each { println it.name } } }


task checkConfigs { doLast { println configurations.names } }
